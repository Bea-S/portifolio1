<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swagger UI - To-Do List API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #f3f5fb;
      }
      #swagger-ui {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <!-- Embedded task grid to align portfolio projects section -->
    <main class="app">
      <div class="task-grid-section">
        <div class="task-grid">
          <div class="task-grid-header">
            <div class="col-title"></div>
            <div class="col-start">Data de Início</div>
            <div class="col-end">Data de Fim</div>
            <div class="col-level">Nível</div>
            <div class="col-actions">Ações</div>
          </div>
          <div id="task-rows" class="task-rows"></div>
          <p id="empty-state" class="empty-state hidden">Nenhuma tarefa encontrada.</p>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        // initialize swagger UI in its container as before
        SwaggerUIBundle({
          url: './swagger.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
          layout: 'BaseLayout',
          theme: 'flattop'
        });
        // render tasks grid (app.js will run its init and fetch tasks)
      };
    </script>
  </body>
</html>
